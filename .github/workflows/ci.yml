# Continuous integration.
#
#   CI enforces the g++ 12 compiler floor and proves the suite passes on a clean
#   machine. It is deliberately NOT a performance gate.
#
#   g++ 12 is the FLOOR: it is what the guard in CMakeLists.txt refuses below. Newer
#   compilers in the matrix add newer diagnostics and newer ASan/UBSan implementations
#   that catch undefined behaviour older ones miss.
#
# Deliberately absent:
#   - TSan. The engine is single-threaded by design, so TSan can find nothing today.
#   - Any assertion about benchmark NUMBERS. Runners are shared, unpinned and noisy; a p99.9
#     threshold would flap red on unrelated load, and a flapping alert trains you to ignore it.
#   - Release artifacts / deploys. Nothing consumes this as a binary.
#   - -Werror. The build already sets -Wall -Wextra -Wconversion; promoting those to errors
#     is a build-policy change, not a CI decision.
#
# The runner image is pinned to ubuntu-24.04 rather than ubuntu-latest, for the same reason
# the compilers are installed by name: `latest` is a moving target, and a silent image bump
# could change which gcc versions apt can offer.

name: ci

on:
  push:
  pull_request:
  # Manual "Run workflow" button. Note it only appears once this file is on the DEFAULT
  # branch. Its use is on-demand gate runs, since `gate` fires on anything that is not a push.
  workflow_dispatch:
  schedule:
    # Nightly. Offset from the top of the hour on purpose: GitHub queues a large share of
    # all scheduled jobs at :00, and runs there start late.
    - cron: '17 3 * * *'

concurrency:
  # Three pushes in a row otherwise queue three full runs against superseded code.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------------------
  # The fast loop. Runs on every push. Everything EXCEPT the fuzz gate.
  #
  # `-LE gate` is a LABEL exclusion, the same one `ctest --preset fast` applies and the
  # opt-out CMakeLists.txt documents. Not `-E gate`, a name regex: it matches `fuzz_gate`
  # today, but would silently also exclude any future test whose NAME contains "gate".
  # ---------------------------------------------------------------------------------------
  test:
    name: test (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false   # one compiler failing must not hide what the others would have said
      matrix:
        compiler: [g++-12, g++-13, g++-14]
    steps:
      - uses: actions/checkout@v7

      # The matrix compiler is installed by name. NEVER rely on the runner image default: it
      # changes without notice, which would silently move the floor this job exists to test.
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.compiler }}

      # Catch2 arrives via FetchContent, so a cold runner re-clones and rebuilds it every run.
      # THE COMPILER AND BUILD TYPE ARE BOTH IN THE KEY, and this is not cosmetic: `_deps`
      # holds Catch2's BUILD as well as its source, and the Debug build is sanitized while
      # Bench is not. A key that omitted either could serve a Catch2 compiled with different
      # flags and produce a green run that means nothing.
      - name: Cache Catch2
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-debug-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt') }}

      # -DCMAKE_CXX_COMPILER, not the CXX env var: this is the exact form the project's own
      # configure-time guard prescribes when it refuses a too-old compiler, so local and CI
      # invocations stay identical. Without it, a plain configure picks up the runner's system
      # c++, which is not necessarily the matrix compiler under test.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j

      - name: Test (gate excluded)
        run: ctest --test-dir build --output-on-failure -LE gate

  # ---------------------------------------------------------------------------------------
  # The fuzz gate: the million-operation property run, the 100k differential with the
  # seven invariants, and the shrinker. ~6m22s under the sanitizers.
  #
  # NOT on push, on purpose. Six minutes is long enough that you stop watching your own CI,
  # and an ignored signal is worse than no signal. It still runs before anything merges and
  # every night, so it is never skipped - only moved off the edit loop. This is the one
  # tradeoff in the file that is about attention rather than cost (runs here are free).
  # ---------------------------------------------------------------------------------------
  gate:
    name: gate (${{ matrix.compiler }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # the ctest TIMEOUT on fuzz_gate is 2400s; this bounds the job around it
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-12, g++-13, g++-14]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.compiler }}

      - name: Cache Catch2
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: deps-debug-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt') }}

      # -DCMAKE_CXX_COMPILER, not the CXX env var: this is the exact form the project's own
      # configure-time guard prescribes when it refuses a too-old compiler, so local and CI
      # invocations stay identical. Without it, a plain configure picks up the runner's system
      # c++, which is not necessarily the matrix compiler under test.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}

      - name: Build
        run: cmake --build build -j

      # The full suite, gate included.
      #
      # ME_FUZZ_SEED rotates the stream for the two SEARCH gates - the million-operation
      # property run and the 100k differential. Unset, which is the local default, reproduces
      # the recorded streams exactly. The shrinker gate is deliberately NOT rotated: its
      # REQUIRE(has_trade_at_100(cmds)) is a precondition on the stream, so a new one could
      # fail it for a reason that is not the shrinker. One seed across the matrix, not one
      # per compiler, so a red run is unambiguously the compiler rather than the stream.
      # Echoed because a failure is only reproducible if the seed is in the log.
      - name: Test (everything)
        env:
          ME_FUZZ_SEED: ${{ github.run_id }}
        run: |
          echo "ME_FUZZ_SEED=$ME_FUZZ_SEED"
          ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------------------
  # The bench targets are COMPILED and never run.
  #
  # They only exist under -DCMAKE_BUILD_TYPE=Bench, which builds no tests, so nothing else
  # in this file touches them - and bench/*.cpp is where the rdtscp timing and the NaiveBook
  # adapter live, which is exactly the code that bit-rots unnoticed. Compiling it is the
  # cheap half of the value.
  #
  # Running it would be the expensive, worthless half: see the header. One compiler is
  # enough here - g++-12 is the floor, and code that compiles at the floor compiles above it.
  # ---------------------------------------------------------------------------------------
  bench:
    name: bench targets compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-12

      # Separate path AND a "bench" key: the Bench build is unsanitized, so its Catch2 must
      # never be confused with the Debug jobs' sanitized one.
      - name: Cache Catch2
        uses: actions/cache@v6
        with:
          path: build-bench/_deps
          key: deps-bench-g++-12-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Bench -DCMAKE_CXX_COMPILER=g++-12

      - name: Build benchmarks (not run)
        run: cmake --build build-bench --target bench_latency bench_profile bench_baseline -j
